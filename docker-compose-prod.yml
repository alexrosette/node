services:
  remnanode:
    image: ghcr.io/alexrosette/node:latest
    container_name: remnanode
    hostname: remnanode
    network_mode: host
    restart: always
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      - NODE_PORT=2222
      - SECRET_KEY=""
      # Multi-panel: one SECRET_KEY_N per extra panel (see MULTI_PANEL.md).
      # Without NODE_PORT_N the panel shares NODE_PORT (routed by SNI).
      # - SECRET_KEY_2=""
      # - SECRET_KEY_3=""
      # - NODE_PORT_3=2224   # optional: own port for panel 3
